<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Chater - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        /* FONDO ANIMADO */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1557683316-973673baf926?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80') center/cover;
            opacity: 0.2;
            z-index: -1;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* CONTENEDOR LOGIN */
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.2),
                inset 0 1px 0 rgba(255,255,255,0.5);
            animation: slideIn 1s ease-out;
            max-width: 450px;
            width: 90%;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* TÍTULO */
        h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        /* INPUT NOMBRE */
        .name-input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .name-input {
            width: 100%;
            padding: 20px 25px 20px 60px;
            font-size: 1.2rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .name-input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .name-input:focus {
            border-color: #4ecdc4;
            box-shadow: 0 0 30px rgba(78,205,196,0.4);
            transform: scale(1.02);
        }

        .input-icon {
            position: absolute;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            color: #4ecdc4;
            font-size: 1.3rem;
        }

        /* ESTADO LOGUEADO */
        .logged-in {
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }

        .welcome-text {
            color: white;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .user-name {
            background: rgba(255,255,255,0.2);
            padding: 12px 25px;
            border-radius: 15px;
            display: inline-block;
            font-size: 1.5rem;
            color: white;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* BOTÓN CONTINUAR */
        .continue-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            background-size: 300% 300%;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 15px 35px rgba(255,107,107,0.4);
            animation: gradientShift 3s ease infinite;
            position: relative;
            overflow: hidden;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px rgba(255,107,107,0.6);
        }

        .continue-btn:active {
            transform: translateY(-1px);
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .login-container {
                padding: 40px 30px;
                margin: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <h1><i class="fas fa-user-plus"></i> Martin Chater</h1>
        <p class="subtitle">Ingresa tu nombre para comenzar</p>

        <!-- ESTADO LOGUEADO -->
        <div id="loggedInSection" class="logged-in" style="display: none;">
            <div class="welcome-text">
                <i class="fas fa-check-circle"></i> ¡Bienvenido de nuevo!
            </div>
            <div class="user-name" id="displayName"></div>
            <!-- ✅ BOTÓN PARA IR AL CHAT -->
            <button class="continue-btn" id="goToChatBtn">
                <i class="fas fa-rocket"></i> Ir al Chat
            </button>
        </div>

        <!-- FORMULARIO LOGIN -->
        <div id="loginForm">
            <div class="name-input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" 
                       class="name-input" 
                       id="userNameInput" 
                       placeholder="Tu nombre aquí..." 
                       maxlength="20"
                       autocomplete="off">
            </div>
            <button class="continue-btn" id="continueBtn">
                <i class="fas fa-arrow-right"></i> Continuar
            </button>
        </div>
    </div>

    <script>
        // SISTEMA DE GUARDADO LOCAL
        const STORAGE_KEY = 'martinChaterUser';
        const userNameInput = document.getElementById('userNameInput');
        const continueBtn = document.getElementById('continueBtn');
        const goToChatBtn = document.getElementById('goToChatBtn');
        const loginForm = document.getElementById('loginForm');
        const loggedInSection = document.getElementById('loggedInSection');
        const displayName = document.getElementById('displayName');

        // CARGAR USUARIO AL INICIAR
        function loadUser() {
            const savedUser = localStorage.getItem(STORAGE_KEY);
            if (savedUser) {
                const userData = JSON.parse(savedUser);
                displayName.textContent = userData.name;
                loginForm.style.display = 'none';
                loggedInSection.style.display = 'block';
                userNameInput.value = userData.name;
                return userData;
            }
            return null;
        }

        // GUARDAR USUARIO
        function saveUser(name) {
            const userData = {
                name: name,
                coins: 0,      // 💰 Para dinero futuro
                level: 1,      // 📊 Para progreso futuro
                joined: new Date().toISOString()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
            return userData;
        }

        // NUEVO: Ir al chat (para usuarios logueados)
        goToChatBtn.addEventListener('click', function() {
            window.location.href = 'inicio.html';
        });

        // REGISTRO NUEVO USUARIO
        continueBtn.addEventListener('click', function() {
            const name = userNameInput.value.trim();
            if (name.length < 2) {
                userNameInput.style.borderColor = '#ff6b6b';
                userNameInput.placeholder = '¡Nombre muy corto!';
                setTimeout(() => {
                    userNameInput.style.borderColor = 'rgba(255,255,255,0.3)';
                    userNameInput.placeholder = 'Tu nombre aquí...';
                }, 2000);
                return;
            }

            // GUARDAR Y REDIRIGIR
            saveUser(name);
            window.location.href = 'inicio.html';
        });

        // ENTER PARA ENVIAR
        userNameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                continueBtn.click();
            }
        });

        // INPUT EN FOCO
        userNameInput.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });

        userNameInput.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });

        // INICIALIZAR
        loadUser();
    </script>
</body>
</html>
