<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martina AI Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --sky:        #5bc8f5;
            --sky-light:  #a8e6f8;
            --sky-pale:   #d6f2fd;
            --aqua:       #00b4d8;
            --aqua-dark:  #0077a8;
            --ice:        #e8f7fd;
            --ice2:       #f0faff;
            --white:      #ffffff;
            --glass:      rgba(255,255,255,0.65);
            --glass2:     rgba(255,255,255,0.4);
            --glass3:     rgba(255,255,255,0.85);
            --shadow-blue: rgba(0,120,180,0.18);
            --shadow-deep: rgba(0,60,120,0.22);
            --text:       #1a3a52;
            --text-mid:   #3a6a8a;
            --text-light: #6a9ab8;
            --text-pale:  #a0c4d8;
            --user-bubble: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 50%, #7dd3fc 100%);
            --ai-bubble:   rgba(255,255,255,0.82);
            --accent:     #0ea5e9;
            --accent2:    #38bdf8;
            --danger:     #ef4444;
            --gold:       #f59e0b;
        }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--ice2);
            color: var(--text);
        }

        /* ─── Animated background ─── */
        .bg-wrap {
            position: fixed; inset: 0; z-index: 0; overflow: hidden;
        }
        .bg-gradient {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(91,200,245,0.35) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(0,180,216,0.28) 0%, transparent 50%),
                radial-gradient(ellipse 50% 70% at 60% 40%, rgba(125,211,252,0.2) 0%, transparent 60%),
                linear-gradient(180deg, #daf4fd 0%, #edf8ff 40%, #f5fbff 100%);
            animation: bgPulse 10s ease-in-out infinite;
        }
        @keyframes bgPulse {
            0%,100% { filter: brightness(1); }
            50% { filter: brightness(1.04); }
        }

        /* Floating orbs */
        .orb {
            position: absolute; border-radius: 50%; pointer-events: none;
            filter: blur(40px); animation: orbFloat 18s ease-in-out infinite;
        }
        .orb1 { width: 380px; height: 380px; background: radial-gradient(circle, rgba(91,200,245,0.45) 0%, transparent 70%); top: -80px; left: -80px; animation-duration: 16s; }
        .orb2 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(0,180,216,0.35) 0%, transparent 70%); bottom: -60px; right: -60px; animation-duration: 20s; animation-delay: -6s; }
        .orb3 { width: 200px; height: 200px; background: radial-gradient(circle, rgba(125,211,252,0.4) 0%, transparent 70%); top: 40%; left: 60%; animation-duration: 14s; animation-delay: -3s; }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px,-20px) scale(1.05); }
            66% { transform: translate(-20px,25px) scale(0.96); }
        }

        /* Bubble texture */
        .bubbles-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .bub {
            position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.6);
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.7), rgba(91,200,245,0.1));
            animation: bubRise linear infinite;
        }
        @keyframes bubRise {
            0% { transform: translateY(110vh) scale(0.8); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
        }

        /* ─── Layout ─── */
        .app {
            position: relative; z-index: 10;
            height: 100vh; display: flex; flex-direction: column;
        }

        /* ─── Topbar ─── */
        .topbar {
            flex-shrink: 0;
            height: 62px;
            background: var(--glass3);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border-bottom: 1.5px solid rgba(255,255,255,0.8);
            box-shadow:
                0 1px 0 rgba(255,255,255,0.9) inset,
                0 4px 24px var(--shadow-blue),
                0 1px 0 rgba(0,120,180,0.08);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; gap: 12px;
        }

        .topbar-left { display: flex; align-items: center; gap: 12px; }

        .back-btn {
            display: flex; align-items: center; gap: 6px;
            background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(220,242,255,0.85) 100%);
            border: 1.5px solid rgba(255,255,255,0.9);
            box-shadow: 0 2px 8px rgba(0,120,180,0.15), inset 0 1px 0 rgba(255,255,255,0.95);
            color: var(--aqua-dark); padding: 7px 14px; border-radius: 22px;
            font-family: 'Nunito'; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; text-decoration: none; white-space: nowrap;
        }
        .back-btn:hover {
            background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(200,238,255,0.95) 100%);
            box-shadow: 0 4px 14px rgba(0,120,180,0.22), inset 0 1px 0 rgba(255,255,255,1);
            transform: translateY(-1px);
        }
        .back-btn svg { flex-shrink: 0; }

        /* AI Avatar + name */
        .ai-identity { display: flex; align-items: center; gap: 10px; }
        .ai-avatar {
            width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 50%, #7dd3fc 100%);
            box-shadow: 0 0 0 2.5px rgba(255,255,255,0.9), 0 3px 12px rgba(14,165,233,0.4);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .ai-avatar::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
            border-radius: 50% 50% 0 0;
        }
        .ai-avatar svg { position: relative; z-index: 1; }
        .ai-name-wrap { line-height: 1.2; }
        .ai-name {
            font-family: 'Quicksand'; font-size: 16px; font-weight: 700; color: var(--text);
            letter-spacing: 0.3px;
        }
        .ai-status {
            font-size: 11px; font-weight: 600; color: #22c55e;
            display: flex; align-items: center; gap: 4px;
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%; background: #22c55e;
            box-shadow: 0 0 6px rgba(34,197,94,0.7);
            animation: statusPulse 2s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%,100% { box-shadow: 0 0 6px rgba(34,197,94,0.7); }
            50% { box-shadow: 0 0 12px rgba(34,197,94,1); }
        }

        .topbar-center { flex: 1; display: flex; justify-content: center; }

        .topbar-right { display: flex; align-items: center; gap: 10px; }

        /* Coins badge */
        .coins-badge {
            display: flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fbbf24 100%);
            border: 1.5px solid rgba(251,191,36,0.6);
            box-shadow: 0 2px 10px rgba(245,158,11,0.25), inset 0 1px 0 rgba(255,255,255,0.7);
            padding: 6px 14px; border-radius: 22px;
            font-weight: 800; font-size: 13px; color: #92400e;
            white-space: nowrap;
        }
        .coin-icon { font-size: 14px; }

        /* User chip */
        .user-chip {
            display: flex; align-items: center; gap: 8px;
            background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(220,242,255,0.88) 100%);
            border: 1.5px solid rgba(255,255,255,0.9);
            box-shadow: 0 2px 8px rgba(0,120,180,0.12), inset 0 1px 0 rgba(255,255,255,0.95);
            padding: 5px 14px 5px 5px; border-radius: 22px;
        }
        .user-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #5bc8f5, #0ea5e9);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.9);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .username { font-size: 13px; font-weight: 700; color: var(--text); }

        .logout-btn {
            background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,230,230,0.85) 100%);
            border: 1.5px solid rgba(255,255,255,0.9);
            box-shadow: 0 2px 8px rgba(180,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.95);
            color: #dc2626; padding: 7px 14px; border-radius: 22px;
            font-family: 'Nunito'; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover {
            background: linear-gradient(180deg, #fff 0%, #fee2e2 100%);
            box-shadow: 0 4px 14px rgba(220,38,38,0.2), inset 0 1px 0 #fff;
            transform: translateY(-1px);
        }

        /* ─── Chat Area ─── */
        .chat-wrap {
            flex: 1; overflow: hidden; display: flex; flex-direction: column;
            padding: 0 16px 16px;
        }

        .messages-area {
            flex: 1; overflow-y: auto; padding: 20px 0 8px;
            display: flex; flex-direction: column; gap: 14px;
            scrollbar-width: thin; scrollbar-color: rgba(91,200,245,0.4) transparent;
        }
        .messages-area::-webkit-scrollbar { width: 5px; }
        .messages-area::-webkit-scrollbar-track { background: transparent; }
        .messages-area::-webkit-scrollbar-thumb { background: rgba(91,200,245,0.45); border-radius: 10px; }

        /* ─── Welcome ─── */
        .welcome-card {
            margin: auto; max-width: 420px; width: 100%; text-align: center;
            padding: 32px 28px;
            background: var(--glass3);
            backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255,255,255,0.92);
            border-radius: 28px;
            box-shadow: 0 8px 40px var(--shadow-blue), 0 2px 0 rgba(255,255,255,0.9) inset;
            animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .welcome-orb {
            width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 16px;
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 50%, #0284c7 100%);
            box-shadow: 0 0 0 8px rgba(56,189,248,0.15), 0 8px 28px rgba(14,165,233,0.4);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .welcome-orb::before {
            content: '';
            position: absolute; top: 6%; left: 15%; width: 55%; height: 40%;
            background: rgba(255,255,255,0.5); border-radius: 50%;
            transform: rotate(-20deg);
        }
        .welcome-title {
            font-family: 'Quicksand'; font-size: 22px; font-weight: 700; color: var(--text);
            margin-bottom: 8px;
        }
        .welcome-sub {
            font-size: 14px; color: var(--text-mid); line-height: 1.6; margin-bottom: 20px;
        }
        .suggestion-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .chip {
            background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(210,240,255,0.9) 100%);
            border: 1.5px solid rgba(91,200,245,0.45);
            box-shadow: 0 2px 8px rgba(0,120,180,0.1), inset 0 1px 0 rgba(255,255,255,0.9);
            color: var(--aqua-dark); padding: 7px 14px; border-radius: 20px;
            font-size: 12.5px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: 'Nunito';
        }
        .chip:hover {
            background: linear-gradient(180deg, #fff 0%, #c5eeff 100%);
            border-color: rgba(14,165,233,0.6);
            box-shadow: 0 4px 14px rgba(14,165,233,0.2), inset 0 1px 0 #fff;
            transform: translateY(-1px);
        }

        /* ─── Message Rows ─── */
        .msg-row {
            display: flex; gap: 10px; max-width: 680px;
            animation: msgIn 0.35s cubic-bezier(0.34,1.4,0.64,1) both;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg-row.user { margin-left: auto; flex-direction: row-reverse; }
        .msg-row.ai   { margin-right: auto; }

        /* Small avatar in chat */
        .msg-avatar {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,120,180,0.2);
            position: relative; overflow: hidden;
        }
        .msg-avatar.ai-av {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
        }
        .msg-avatar.ai-av::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, transparent 100%);
        }
        .msg-avatar.user-av {
            background: linear-gradient(135deg, #5bc8f5, #0077a8);
        }
        .msg-avatar svg { position: relative; z-index: 1; }

        /* Bubble */
        .bubble {
            padding: 12px 16px; border-radius: 20px; max-width: 520px;
            font-size: 14.5px; line-height: 1.65; position: relative;
        }
        .bubble.user-b {
            background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 60%, #7dd3fc 100%);
            color: #fff;
            border-radius: 20px 4px 20px 20px;
            box-shadow: 0 4px 18px rgba(14,165,233,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        .bubble.ai-b {
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(12px);
            color: var(--text);
            border: 1.5px solid rgba(255,255,255,0.95);
            border-radius: 4px 20px 20px 20px;
            box-shadow: 0 4px 20px var(--shadow-blue), inset 0 1px 0 rgba(255,255,255,1);
        }

        /* Typing indicator */
        .typing-bubble {
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255,255,255,0.95);
            border-radius: 4px 20px 20px 20px;
            box-shadow: 0 4px 20px var(--shadow-blue), inset 0 1px 0 rgba(255,255,255,1);
            padding: 14px 18px; display: flex; align-items: center; gap: 5px;
        }
        .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--sky); animation: dotBounce 1.2s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.18s; }
        .dot:nth-child(3) { animation-delay: 0.36s; }
        @keyframes dotBounce {
            0%,60%,100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Markdown-ish styling inside bubble */
        .bubble p { margin-bottom: 8px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble strong { font-weight: 700; }
        .bubble em { font-style: italic; }
        .bubble code {
            background: rgba(0,120,180,0.1); padding: 1px 6px; border-radius: 5px;
            font-family: 'Courier New', monospace; font-size: 13px; color: var(--aqua-dark);
        }
        .bubble.user-b code { background: rgba(255,255,255,0.2); color: #fff; }
        .bubble pre {
            background: rgba(0,40,80,0.08); border-radius: 10px; padding: 10px 12px;
            overflow-x: auto; margin: 8px 0; font-size: 12.5px;
        }
        .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
        .bubble li { margin-bottom: 3px; }
        .bubble h3 { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: var(--aqua-dark); }
        .bubble.user-b h3 { color: rgba(255,255,255,0.95); }

        /* Timestamp */
        .msg-time {
            font-size: 10.5px; color: var(--text-pale); margin-top: 3px;
            text-align: right; padding: 0 4px;
        }
        .msg-row.ai .msg-time { text-align: left; }

        /* ─── Input Area ─── */
        .input-wrap {
            flex-shrink: 0; padding-top: 8px;
        }
        .input-panel {
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(20px) saturate(1.5);
            border: 1.5px solid rgba(255,255,255,0.95);
            border-radius: 26px;
            box-shadow: 0 4px 30px var(--shadow-blue), 0 1px 0 rgba(255,255,255,1) inset;
            padding: 10px 10px 10px 18px;
            display: flex; align-items: flex-end; gap: 10px;
        }
        .input-field {
            flex: 1; border: none; background: transparent; outline: none; resize: none;
            font-family: 'Nunito'; font-size: 14.5px; color: var(--text); line-height: 1.55;
            max-height: 130px; min-height: 28px;
            scrollbar-width: none;
        }
        .input-field::placeholder { color: var(--text-pale); }
        .input-field::-webkit-scrollbar { display: none; }

        .send-btn {
            width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #0ea5e9 0%, #38bdf8 60%, #7dd3fc 100%);
            border: none; cursor: pointer;
            box-shadow: 0 3px 14px rgba(14,165,233,0.45), inset 0 1px 0 rgba(255,255,255,0.4);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .send-btn::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%);
            border-radius: 50% 50% 0 0;
        }
        .send-btn:hover:not(:disabled) {
            transform: scale(1.07) translateY(-1px);
            box-shadow: 0 6px 20px rgba(14,165,233,0.55), inset 0 1px 0 rgba(255,255,255,0.5);
        }
        .send-btn:active:not(:disabled) { transform: scale(0.96); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .send-btn svg { position: relative; z-index: 1; }

        .input-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 4px 0;
        }
        .input-hint { font-size: 11px; color: var(--text-pale); }
        .model-badge {
            display: flex; align-items: center; gap: 5px;
            background: linear-gradient(135deg, rgba(14,165,233,0.1), rgba(56,189,248,0.1));
            border: 1px solid rgba(14,165,233,0.25); border-radius: 12px;
            padding: 3px 10px; font-size: 11px; font-weight: 700; color: var(--aqua-dark);
        }

        /* ─── Scrollbar to bottom button ─── */
        .scroll-btn {
            position: absolute; bottom: 90px; right: 24px; z-index: 20;
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--glass3); backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255,255,255,0.9);
            box-shadow: 0 4px 16px var(--shadow-blue);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            opacity: 0; pointer-events: none;
            color: var(--aqua-dark);
        }
        .scroll-btn.visible { opacity: 1; pointer-events: all; }
        .scroll-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--shadow-deep); }

        /* ─── Error banner ─── */
        .error-banner {
            display: none; align-items: center; gap: 10px;
            background: rgba(254,226,226,0.9); backdrop-filter: blur(10px);
            border: 1.5px solid rgba(252,165,165,0.6);
            border-radius: 14px; padding: 10px 16px; margin-bottom: 10px;
            font-size: 13px; color: #991b1b; font-weight: 600;
        }
        .error-banner.show { display: flex; }

        /* ─── Responsive ─── */
        @media (max-width: 600px) {
            .topbar { padding: 0 12px; gap: 8px; }
            .back-btn span { display: none; }
            .ai-name { font-size: 14px; }
            .username { display: none; }
            .coins-badge { padding: 6px 10px; font-size: 12px; }
            .bubble { max-width: calc(100vw - 100px); font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- Background -->
<div class="bg-wrap">
    <div class="bg-gradient"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="bubbles-bg" id="bubbles-bg"></div>
</div>

<div class="app">
    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="categorias.html" class="back-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                <span>Categorías</span>
            </a>
            <div class="ai-identity">
                <div class="ai-avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="8" r="3" fill="white" opacity="0.95"/>
                        <path d="M6 20c0-4 2.7-6 6-6s6 2 6 6" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95"/>
                        <path d="M18 8h1.5a1.5 1.5 0 010 3H18" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
                        <path d="M6 8H4.5a1.5 1.5 0 000 3H6" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
                    </svg>
                </div>
                <div class="ai-name-wrap">
                    <div class="ai-name">Martina AI</div>
                    <div class="ai-status"><span class="status-dot"></span>En línea</div>
                </div>
            </div>
        </div>

        <div class="topbar-right">
            <div class="coins-badge">
                <span class="coin-icon">🪙</span>
                <span id="topbar-coins">0</span>
            </div>
            <div class="user-chip">
                <div class="user-avatar"><img src="logo.png" alt="Avatar" onerror="this.style.display='none'"></div>
                <span class="username" id="username">Usuario</span>
            </div>
            <button class="logout-btn" onclick="logout()">Salir</button>
        </div>
    </header>

    <!-- Chat -->
    <div class="chat-wrap" style="position:relative">
        <div class="messages-area" id="messages-area">
            <!-- Welcome card shown initially -->
            <div class="welcome-card" id="welcome-card">
                <div class="welcome-orb">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="8" r="3.5" fill="white" opacity="0.95"/>
                        <path d="M5 20c0-4.5 3-7 7-7s7 2.5 7 7" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95"/>
                        <path d="M19 8h1.2a1.8 1.8 0 010 3.6H19" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
                        <path d="M5 8H3.8a1.8 1.8 0 000 3.6H5" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
                    </svg>
                </div>
                <div class="welcome-title">¡Hola! Soy Martina AI 👋</div>
                <div class="welcome-sub">Tu asistente personal inteligente. Puedo ayudarte con preguntas, redacción, código, análisis, ideas y mucho más.</div>
                <div class="suggestion-chips" id="chips">
                    <button class="chip" onclick="sendChip(this)">¿Qué puedes hacer?</button>
                    <button class="chip" onclick="sendChip(this)">Explícame qué es la IA</button>
                    <button class="chip" onclick="sendChip(this)">Escríbeme un poema</button>
                    <button class="chip" onclick="sendChip(this)">Dame ideas creativas</button>
                    <button class="chip" onclick="sendChip(this)">Ayúdame con código</button>
                </div>
            </div>
        </div>

        <!-- Error -->
        <div class="error-banner" id="error-banner">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="error-msg">Error al conectar con la IA.</span>
        </div>

        <!-- Scroll down btn -->
        <button class="scroll-btn" id="scroll-btn" onclick="scrollToBottom(true)" title="Ir al fondo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </button>

        <!-- Input -->
        <div class="input-wrap">
            <div class="input-panel">
                <textarea
                    class="input-field"
                    id="user-input"
                    placeholder="Escribe tu mensaje…"
                    rows="1"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()" title="Enviar">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
            <div class="input-footer">
                <span class="input-hint">Intro para enviar · Shift+Intro nueva línea</span>
                <div class="model-badge">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>
                    claude-sonnet-4-20250514
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ─── Auth ───
    let userData = null;
    let balance = 0;

    function checkAuth() {
        const stored = localStorage.getItem('martinChaterUser');
        if (!stored) { window.location.href = 'login.html'; return; }
        userData = JSON.parse(stored);
        balance = userData.coins || 0;
        document.getElementById('username').textContent = userData.name || 'Usuario';
        document.getElementById('topbar-coins').textContent = balance.toLocaleString();
    }

    function logout() {
        localStorage.removeItem('martinChaterUser');
        window.location.href = 'index.html';
    }

    // ─── Conversation history ───
    let history = [];
    let isStreaming = false;

    // ─── Bubble backgrounds ───
    (function spawnBubbles() {
        const c = document.getElementById('bubbles-bg');
        for (let i = 0; i < 18; i++) {
            const b = document.createElement('div');
            b.className = 'bub';
            const size = 14 + Math.random() * 40;
            b.style.cssText = `
                width:${size}px; height:${size}px;
                left:${Math.random()*100}%;
                animation-delay:${Math.random()*22}s;
                animation-duration:${18+Math.random()*18}s;
                opacity:${0.25+Math.random()*0.35}
            `;
            c.appendChild(b);
        }
    })();

    // ─── Scroll ───
    const area = document.getElementById('messages-area');
    const scrollBtn = document.getElementById('scroll-btn');

    area.addEventListener('scroll', () => {
        const fromBottom = area.scrollHeight - area.scrollTop - area.clientHeight;
        scrollBtn.classList.toggle('visible', fromBottom > 120);
    });

    function scrollToBottom(smooth = false) {
        area.scrollTo({ top: area.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
    }

    // ─── Auto-resize textarea ───
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 130) + 'px';
    }

    // ─── Key handler ───
    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // ─── Chip click ───
    function sendChip(btn) {
        document.getElementById('user-input').value = btn.textContent;
        sendMessage();
    }

    // ─── Format timestamp ───
    function nowTime() {
        return new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
    }

    // ─── Simple markdown renderer ───
    function renderMarkdown(text) {
        return text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            // code blocks
            .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
            // inline code
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            // bold
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            // italic
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            // h3
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            // unordered list
            .replace(/^\* (.+)$/gm, '<li>$1</li>')
            .replace(/^- (.+)$/gm, '<li>$1</li>')
            // numbered list
            .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
            // wrap li groups
            .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
            // paragraphs
            .replace(/\n{2,}/g, '</p><p>')
            .replace(/^(.+)$/, '<p>$1</p>')
            .replace(/<p><\/p>/g, '');
    }

    // ─── Append message to DOM ───
    function appendMessage(role, content, streaming = false) {
        // Remove welcome card on first message
        const wc = document.getElementById('welcome-card');
        if (wc) wc.remove();

        const row = document.createElement('div');
        row.className = `msg-row ${role}`;
        if (streaming) row.id = 'streaming-row';

        const avatarDiv = document.createElement('div');
        avatarDiv.className = `msg-avatar ${role === 'ai' ? 'ai-av' : 'user-av'}`;
        avatarDiv.innerHTML = role === 'ai'
            ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="2.5" fill="white" opacity="0.95"/><path d="M7 20c0-3.5 2.2-5 5-5s5 1.5 5 5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95"/></svg>`
            : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3" fill="white" opacity="0.9"/><path d="M6 20c0-4 2.5-6 6-6s6 2 6 6" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/></svg>`;

        const col = document.createElement('div');
        col.style.cssText = 'display:flex;flex-direction:column;gap:2px;max-width:100%';

        const bubble = document.createElement('div');
        bubble.className = `bubble ${role === 'ai' ? 'ai-b' : 'user-b'}`;
        if (streaming) bubble.id = 'streaming-bubble';

        if (role === 'user') {
            bubble.textContent = content;
        } else {
            bubble.innerHTML = content ? renderMarkdown(content) : '';
        }

        const time = document.createElement('div');
        time.className = 'msg-time';
        time.textContent = nowTime();

        col.appendChild(bubble);
        col.appendChild(time);

        if (role === 'ai') {
            row.appendChild(avatarDiv);
            row.appendChild(col);
        } else {
            row.appendChild(col);
            row.appendChild(avatarDiv);
        }

        area.appendChild(row);
        scrollToBottom();
        return { row, bubble };
    }

    // ─── Typing indicator ───
    function showTyping() {
        const wc = document.getElementById('welcome-card');
        if (wc) wc.remove();

        const row = document.createElement('div');
        row.className = 'msg-row ai';
        row.id = 'typing-row';

        const avatarDiv = document.createElement('div');
        avatarDiv.className = 'msg-avatar ai-av';
        avatarDiv.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="2.5" fill="white" opacity="0.95"/><path d="M7 20c0-3.5 2.2-5 5-5s5 1.5 5 5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95"/></svg>`;

        const tb = document.createElement('div');
        tb.className = 'typing-bubble';
        tb.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

        row.appendChild(avatarDiv);
        row.appendChild(tb);
        area.appendChild(row);
        scrollToBottom();
    }
    function hideTyping() {
        const t = document.getElementById('typing-row');
        if (t) t.remove();
    }

    // ─── Error banner ───
    function showError(msg) {
        document.getElementById('error-msg').textContent = msg;
        document.getElementById('error-banner').classList.add('show');
        setTimeout(() => document.getElementById('error-banner').classList.remove('show'), 5000);
    }

    // ─── Send message ───
    async function sendMessage() {
        if (isStreaming) return;
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        input.style.height = 'auto';
        document.getElementById('send-btn').disabled = true;
        isStreaming = true;

        // Show user message
        appendMessage('user', text);

        // Add to history
        history.push({ role: 'user', content: text });

        // Show typing
        showTyping();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: history })
            });

            hideTyping();

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err?.error?.message || `HTTP ${response.status}`);
            }

            const data = await response.json();
            const reply = data.content?.map(b => b.type === 'text' ? b.text : '').join('') || '';

            // Add to history
            history.push({ role: 'assistant', content: reply });

            // Show AI message
            appendMessage('ai', reply);

        } catch (err) {
            hideTyping();
            console.error(err);
            showError('Error al contactar la IA: ' + (err.message || 'Inténtalo de nuevo'));
            // Remove last user message from history on error
            history.pop();
        }

        isStreaming = false;
        document.getElementById('send-btn').disabled = false;
        input.focus();
    }

    // ─── Init ───
    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        document.getElementById('user-input').focus();
    });
</script>
</body>
</html>
