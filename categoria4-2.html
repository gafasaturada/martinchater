<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Martin Chater - Próximamente</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #050505;
            --surface: #0d0d0d;
            --border: #1a1a1a;
            --green: #00ff66;
            --green-dim: rgba(0, 255, 102, 0.1);
            --text: #e8e8e8;
            --text-dim: #666666;
            --sidebar-w: 72px;
            --topbar-h: 64px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Efecto de grano sutil */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 100; opacity: 0.3;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed; left: 0; top: 0; width: var(--sidebar-w); height: 100vh;
            background: var(--surface); border-right: 1px solid var(--border); z-index: 10;
            display: flex; flex-direction: column; align-items: center; padding: 20px 0;
        }

        .sidebar::after {
            content: ''; position: absolute; top: 0; right: -1px; width: 1px; height: 100%;
            background: linear-gradient(180deg, transparent, var(--green), transparent); opacity: 0.6;
        }

        .sidebar-logo { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border); }

        /* MAIN CONTENT */
        .main-container {
            margin-left: var(--sidebar-w);
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .coming-soon-box {
            animation: fadeIn 1s ease;
        }

        .icon-box {
            font-size: 4rem;
            color: var(--green);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        .title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5rem;
            letter-spacing: 10px;
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-dim);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        /* BOTONES */
        .btn-group {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 14px 28px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--green);
            color: var(--bg);
            border: 1px solid var(--green);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 255, 102, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--surface);
            border-color: var(--text-dim);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .title { font-size: 3.5rem; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <img src="logo2.png" alt="Logo" class="sidebar-logo">
    </div>

    <div class="main-container">
        <div class="coming-soon-box">
            <div class="icon-box">
                <i class="fas fa-microchip"></i>
            </div>
            <h1 class="title">PRÓXIMAMENTE</h1>
            <p class="subtitle">Estamos optimizando más contenido para ti</p>
            
            <div class="btn-group">
                <a href="categoria4.html" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> VOLVER ATRÁS
                </a>
                <a href="categorias.html" class="btn btn-primary">
                    <i class="fas fa-th-large"></i> CATEGORÍAS
                </a>
            </div>
        </div>
    </div>

</body>
</html>
