<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Global + Chat - Martin Chater</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-primary: #e8c84a;
            --gold-dark: #c9a227;
            --gray-900: #171717;
            --gray-800: #262626;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #0a0a0a; color: var(--white); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        .header { background: var(--gray-900); border-bottom: 2px solid var(--gold-primary); padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { font-family: 'Space Grotesk'; font-weight: 700; color: var(--gold-primary); }

        /* MAIN LAYOUT */
        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* VIDEO SECTION */
        .video-section { flex: 1; display: flex; flex-direction: column; padding: 20px; background: #0f0f0f; justify-content: center; align-items: center; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1000px; aspect-ratio: 16/10; }
        .video-box { background: #000; border: 2px solid var(--gray-800); position: relative; border-radius: 12px; overflow: hidden; height: 100%; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 5px; font-size: 12px; z-index: 2; border: 1px solid var(--gold-primary); }

        /* CHAT SECTION */
        .chat-section { width: 350px; background: var(--gray-900); border-left: 1px solid var(--gray-800); display: flex; flex-direction: column; }
        .chat-header { padding: 15px; border-bottom: 1px solid var(--gray-800); font-family: 'Space Grotesk'; font-weight: 600; color: var(--gold-primary); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg-me { align-self: flex-end; background: var(--gold-primary); color: #000; border-bottom-right-radius: 2px; }
        .msg-them { align-self: flex-start; background: var(--gray-800); color: #fff; border-bottom-left-radius: 2px; }

        .chat-input-area { padding: 15px; border-top: 1px solid var(--gray-800); display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; background: #000; border: 1px solid var(--gray-800); padding: 10px; color: #fff; border-radius: 5px; outline: none; }
        .chat-input-area input:focus { border-color: var(--gold-primary); }
        .send-btn { background: var(--gold-primary); border: none; width: 45px; border-radius: 5px; cursor: pointer; transition: 0.2s; }

        /* CONTROLS */
        .controls { background: var(--gray-900); padding: 20px; display: flex; justify-content: center; gap: 20px; border-top: 1px solid var(--gray-800); }
        .btn { padding: 12px 24px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; font-family: 'Space Grotesk'; }
        .btn-next { background: var(--gold-primary); color: #000; }
        .btn-stop { background: #ff4444; color: #fff; }

        /* OVERLAYS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .overlay.active { display: flex; }
        .spinner { width: 60px; height: 60px; border: 5px solid var(--gray-800); border-top-color: var(--gold-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* BOTÓN CANCELAR */
        .btn-cancel-search {
            margin-top: 30px;
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: 'Space Grotesk';
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }
        .btn-cancel-search:hover { background: #ff4444; color: #fff; }

        @media (max-width: 800px) {
            .main-layout { flex-direction: column; }
            .video-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: auto; height: 100%; }
            .chat-section { width: 100%; height: 250px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">MARTIN CHATER | <span style="color: #fff">CAMERA GLOBAL</span></div>
        <div id="statusText" style="font-size: 0.8rem; color: var(--gold-primary); letter-spacing: 1px;">SISTEMA ACTIVO</div>
    </header>

    <div class="main-layout">
        <div class="video-section">
            <div class="video-grid">
                <div class="video-box">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">TÚ (CÁMARA LOCAL)</div>
                </div>
                <div class="video-box">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-label">EXTRAÑO (CÁMARA REMOTA)</div>
                </div>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-header"><i class="fas fa-comment-dots"></i> CHAT EN VIVO</div>
            <div class="chat-messages" id="chatMessages"></div>
            <form class="chat-input-area" id="chatForm">
                <input type="text" id="chatInput" placeholder="Escribe un mensaje..." autocomplete="off">
                <button type="submit" class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-next" id="nextBtn"><i class="fas fa-forward"></i> SIGUIENTE PERSONA</button>
        <button class="btn btn-stop" onclick="location.href='categorias.html'"><i class="fas fa-times"></i> ABANDONAR</button>
    </div>

    <div class="overlay" id="searchingOverlay">
        <div class="spinner"></div>
        <p style="margin-top: 20px; font-family: 'Space Grotesk'; letter-spacing: 2px;">BUSCANDO PAREJA...</p>
        <button class="btn-cancel-search" id="cancelSearchBtn">Cancelar Búsqueda</button>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getFirestore, collection, doc, setDoc, onSnapshot, 
            updateDoc, serverTimestamp, query, where, getDocs, addDoc, orderBy, deleteDoc 
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyALAhNdKWPNa6pyALvXLpNDx_5g3cZ-RYs",
            authDomain: "chat-global-e5b48.firebaseapp.com",
            projectId: "chat-global-e5b48",
            storageBucket: "chat-global-e5b48.firebasestorage.app",
            messagingSenderId: "556197416000",
            appId: "1:556197416000:web:c3f599481ef4be25c363a5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtcConfig = { iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }] };

        let localStream, peerConnection, currentRoomId, myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
        let chatUnsubscribe = null;

        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const searchingOverlay = document.getElementById('searchingOverlay');

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                startSearching();
            } catch (e) { alert("Se requiere acceso a la cámara."); }
        }

        async function startSearching() {
            searchingOverlay.classList.add('active');
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (chatUnsubscribe) chatUnsubscribe();
            
            const q = query(collection(db, 'videochat_rooms'), where('status', '==', 'waiting'));
            const snapshot = await getDocs(q);

            if (!snapshot.empty) {
                await joinRoom(snapshot.docs[0].id, snapshot.docs[0].data());
            } else {
                await createRoom();
            }
        }

        async function createRoom() {
            currentRoomId = 'room_' + Date.now();
            setupPeer();
            
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            
            await setDoc(doc(db, 'videochat_rooms', currentRoomId), {
                offer: { type: offer.type, sdp: offer.sdp },
                status: 'waiting',
                createdAt: serverTimestamp()
            });

            const unsub = onSnapshot(doc(db, 'videochat_rooms', currentRoomId), async (snap) => {
                const data = snap.data();
                if (data?.answer) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    searchingOverlay.classList.remove('active');
                    listenChat(currentRoomId);
                    unsub();
                }
            });
        }

        async function joinRoom(roomId, roomData) {
            currentRoomId = roomId;
            setupPeer();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            await updateDoc(doc(db, 'videochat_rooms', roomId), {
                answer: { type: answer.type, sdp: answer.sdp },
                status: 'connected'
            });
            searchingOverlay.classList.remove('active');
            listenChat(roomId);
        }

        function setupPeer() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = (e) => {
                document.getElementById('remoteVideo').srcObject = e.streams[0];
            };
            peerConnection.onicecandidate = (e) => {
                if (e.candidate && currentRoomId) {
                    addDoc(collection(db, 'videochat_rooms', currentRoomId, 'candidates'), e.candidate.toJSON());
                }
            };
        }

        function listenChat(roomId) {
            chatMessages.innerHTML = '';
            const q = query(collection(db, 'videochat_rooms', roomId, 'messages'), orderBy('timestamp', 'asc'));
            chatUnsubscribe = onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === 'added') {
                        const data = change.doc.data();
                        const div = document.createElement('div');
                        div.className = `message ${data.sender === myUserId ? 'msg-me' : 'msg-them'}`;
                        div.textContent = data.text;
                        chatMessages.appendChild(div);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                });
            });
        }

        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            if (!chatInput.value.trim() || !currentRoomId) return;
            const text = chatInput.value;
            chatInput.value = '';
            await addDoc(collection(db, 'videochat_rooms', currentRoomId, 'messages'), {
                text: text, sender: myUserId, timestamp: serverTimestamp()
            });
        };

        // EVENTO CANCELAR
        document.getElementById('cancelSearchBtn').onclick = () => {
            searchingOverlay.classList.remove('active');
            if (currentRoomId) {
                deleteDoc(doc(db, 'videochat_rooms', currentRoomId));
                currentRoomId = null;
            }
            if (peerConnection) peerConnection.close();
        };

        document.getElementById('nextBtn').onclick = startSearching;
        init();
    </script>
</body>
</html>
