<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Global - Martin Chater</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold-primary: #e8c84a;
            --gold-light: #f5e6a3;
            --gold-dark: #c9a227;
            --white: #ffffff;
            --off-white: #fafafa;
            --gray-100: #f5f5f5;
            --gray-200: #e5e5e5;
            --gray-400: #a3a3a3;
            --gray-600: #525252;
            --gray-800: #262626;
            --gray-900: #171717;
            --success: #22c55e;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--off-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle {
            position: absolute; width: 8px; height: 8px; background: var(--gold-primary);
            opacity: 0.3; animation: float 20s infinite linear;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .header {
            background: var(--white); border-bottom: 3px solid var(--gold-primary);
            padding: 15px 30px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: var(--shadow-md); position: relative;
            z-index: 10; flex-shrink: 0;
        }

        .logo-icon {
            width: 50px; height: 50px; background: var(--gray-900); color: var(--gold-primary);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; font-family: 'Space Grotesk', sans-serif;
        }

        .header-title h1 { font-family: 'Space Grotesk', sans-serif; font-size: 24px; color: var(--gray-900); }
        .header-title span { font-size: 12px; color: var(--gold-dark); font-weight: 600; }

        .user-badge {
            display: flex; align-items: center; gap: 10px; background: var(--gray-100);
            padding: 10px 20px; border: 2px solid var(--gray-200); font-weight: 600;
        }

        .user-badge::before {
            content: ''; width: 10px; height: 10px; background: var(--success);
            border-radius: 50%; animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .exit-btn {
            background: var(--white); border: 2px solid var(--gray-900);
            padding: 12px 25px; cursor: pointer; transition: all 0.3s var(--ease-spring);
            text-decoration: none; color: var(--gray-900); font-weight: 600;
        }

        .exit-btn:hover { background: var(--gray-900); color: var(--white); }

        .status-bar {
            background: var(--gray-900); color: var(--white); padding: 10px 30px;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
        .status-dot.searching { background: var(--gold-primary); animation: pulse 1s infinite; }
        .status-dot.disconnected { background: var(--danger); }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 20px; position: relative; z-index: 1; }

        .video-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-height: calc(100vh - 280px); }

        .video-box {
            background: var(--gray-900); position: relative; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            border: 3px solid var(--gray-800);
        }

        .video-box.active { border-color: var(--gold-primary); }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }

        .video-label {
            position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.7);
            color: var(--white); padding: 8px 15px; font-size: 13px; display: flex; align-items: center; gap: 8px;
        }

        .controls {
            display: flex; justify-content: center; gap: 15px; padding: 15px;
            background: var(--white); border: 3px solid var(--gold-primary);
        }

        .control-btn {
            padding: 15px 30px; font-weight: 600; border: 2px solid var(--gray-900);
            background: var(--white); cursor: pointer; transition: all 0.3s var(--ease-spring);
        }

        .control-btn.primary { background: var(--gold-primary); border-color: var(--gold-dark); }
        .control-btn.danger { background: var(--danger); color: white; border-color: var(--danger); }

        .searching-overlay {
            position: absolute; inset: 0; background: rgba(23, 23, 23, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 25px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        .searching-overlay.active { opacity: 1; pointer-events: auto; }
        .searching-spinner {
            width: 80px; height: 80px; border: 4px solid var(--gray-800);
            border-top-color: var(--gold-primary); border-radius: 50%; animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .permission-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        .permission-modal.active { opacity: 1; pointer-events: auto; }
        .permission-content { background: var(--white); padding: 40px; text-align: center; border: 3px solid var(--gold-primary); }

        @media (max-width: 768px) {
            .video-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <header class="header">
        <div class="header-left">
            <div class="logo-icon">MC</div>
            <div class="header-title">
                <h1>Camera Global</h1>
                <span>MARTIN CHATER</span>
            </div>
        </div>
        <div class="user-badge"><span id="userDisplay">Visitante</span></div>
        <a href="categorias.html" class="exit-btn">SALIR</a>
    </header>

    <div class="status-bar">
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Esperando...</span>
        </div>
        <div id="onlineCount">0 usuarios online</div>
    </div>

    <div class="main-content">
        <div class="video-container">
            <div class="video-box" id="localVideoBox">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label"><i class="fas fa-user"></i><span id="localLabel">Tu</span></div>
            </div>
            <div class="video-box" id="remoteVideoBox">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label"><i class="fas fa-globe"></i><span id="remoteLabel">Desconocido</span></div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="toggleVideoBtn"><i class="fas fa-video"></i> <span>CAMARA</span></button>
            <button class="control-btn" id="toggleAudioBtn"><i class="fas fa-microphone"></i> <span>MICRO</span></button>
            <button class="control-btn primary" id="nextBtn"><i class="fas fa-forward"></i> <span>SIGUIENTE</span></button>
            <button class="control-btn danger" id="stopBtn"><i class="fas fa-stop"></i> <span>PARAR</span></button>
        </div>

        <div class="searching-overlay" id="searchingOverlay">
            <div class="searching-spinner"></div>
            <div class="searching-text" style="color:white">Buscando usuario...</div>
            <button class="control-btn" id="cancelSearchBtn">CANCELAR</button>
        </div>
    </div>

    <div class="permission-modal" id="permissionModal">
        <div class="permission-content">
            <i class="fas fa-video" style="font-size: 40px; color: var(--gold-primary)"></i>
            <h2>Permitir Camara</h2>
            <p>Necesitas activar tu cámara para continuar.</p><br>
            <button class="control-btn primary" id="requestPermissionBtn">ACTIVAR</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, 
            updateDoc, serverTimestamp, query, where, getDocs, addDoc
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyALAhNdKWPNa6pyALvXLpNDx_5g3cZ-RYs",
            authDomain: "chat-global-e5b48.firebaseapp.com",
            projectId: "chat-global-e5b48",
            storageBucket: "chat-global-e5b48.firebasestorage.app",
            messagingSenderId: "556197416000",
            appId: "1:556197416000:web:c3f599481ef4be25c363a5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const rtcConfig = {
            iceServers: [
                { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }
            ]
        };

        let localStream = null, peerConnection = null, currentRoomId = null;
        let myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
        let isSearching = false;

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const searchingOverlay = document.getElementById('searchingOverlay');

        // Inicialización de UI
        document.getElementById('permissionModal').classList.add('active');

        document.getElementById('requestPermissionBtn').onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                document.getElementById('permissionModal').classList.remove('active');
                startSearching();
            } catch (e) { alert("Error al acceder a la cámara"); }
        };

        function updateStatus(state, text) {
            statusText.textContent = text;
            statusDot.className = 'status-dot ' + state;
        }

        async function startSearching() {
            if (isSearching) return;
            isSearching = true;
            searchingOverlay.classList.add('active');
            updateStatus('searching', 'Buscando...');

            if (peerConnection) peerConnection.close();
            if (currentRoomId) try { await deleteDoc(doc(db, 'videochat_rooms', currentRoomId)); } catch(e){}

            const q = query(collection(db, 'videochat_rooms'), where('status', '==', 'waiting'));
            const snapshot = await getDocs(q);
            
            if (!snapshot.empty) {
                const room = snapshot.docs[0];
                if (room.data().creator !== myUserId) {
                    await joinRoom(room.id, room.data());
                    return;
                }
            }
            await createRoom();
        }

        function setupPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                document.getElementById('remoteVideoBox').classList.add('active');
            };

            peerConnection.oniceconnectionstatechange = () => {
                if (peerConnection.iceConnectionState === 'disconnected') updateStatus('disconnected', 'Desconectado');
            };
        }

        async function createRoom() {
            currentRoomId = 'room_' + Date.now();
            setupPeerConnection();

            // Guardar candidatos ICE en subcolección
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    addDoc(collection(db, 'videochat_rooms', currentRoomId, 'creatorCandidates'), event.candidate.toJSON());
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            await setDoc(doc(db, 'videochat_rooms', currentRoomId), {
                creator: myUserId,
                offer: { type: offer.type, sdp: offer.sdp },
                status: 'waiting'
            });

            onSnapshot(doc(db, 'videochat_rooms', currentRoomId), async (snap) => {
                const data = snap.data();
                if (data?.answer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    searchingOverlay.classList.remove('active');
                    isSearching = false;
                    updateStatus('connected', 'Conectado');
                }
            });

            onSnapshot(collection(db, 'videochat_rooms', currentRoomId, 'joinerCandidates'), (snap) => {
                snap.docChanges().forEach(async (change) => {
                    if (change.type === 'added') await peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
            });
        }

        async function joinRoom(roomId, roomData) {
            currentRoomId = roomId;
            setupPeerConnection();

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    addDoc(collection(db, 'videochat_rooms', roomId, 'joinerCandidates'), event.candidate.toJSON());
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await updateDoc(doc(db, 'videochat_rooms', roomId), {
                answer: { type: answer.type, sdp: answer.sdp },
                status: 'connected'
            });

            onSnapshot(collection(db, 'videochat_rooms', roomId, 'creatorCandidates'), (snap) => {
                snap.docChanges().forEach(async (change) => {
                    if (change.type === 'added') await peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
            });

            searchingOverlay.classList.remove('active');
            isSearching = false;
            updateStatus('connected', 'Conectado');
        }

        document.getElementById('nextBtn').onclick = () => { isSearching = false; startSearching(); };
        document.getElementById('stopBtn').onclick = () => location.reload();
        document.getElementById('cancelSearchBtn').onclick = () => { searchingOverlay.classList.remove('active'); isSearching = false; };
    </script>
</body>
</html>
