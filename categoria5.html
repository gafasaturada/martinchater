<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Trading Terminal PRO - Martin Chater</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --border: #2a2a2a;
            --accent: #ff2244;
            --green: #00ff88;
            --red: #ff2244;
            --yellow: #ffcc00;
            --text: #e0e0e0;
            --muted: #555555;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 12px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
            pointer-events: none;
            z-index: 9999;
        }

        /* ── SIDEBAR ── */
        .market-sidebar {
            width: 210px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-logo {
            padding: 13px 18px;
            font-family: 'VT323', monospace;
            font-size: 28px;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: 2px 2px 0 #800000;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo span { color: var(--green); }
        .sidebar-section {
            padding: 10px 18px 6px;
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .market-item {
            padding: 11px 18px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-family: 'VT323', monospace;
            font-size: 19px;
            letter-spacing: 1px;
            color: var(--muted);
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .market-item:hover { background: rgba(255,34,68,0.06); color: var(--text); }
        .market-item.active {
            border-left: 3px solid var(--accent);
            background: rgba(255,34,68,0.09);
            color: var(--accent);
        }
        .market-item .mprice {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: var(--green);
        }

        /* ── MAIN ── */
        .trading-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .top-info {
            height: 54px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 18px;
            justify-content: space-between;
            background: var(--surface);
            flex-shrink: 0;
        }
        .top-left { display: flex; align-items: baseline; gap: 14px; }
        #symbolTitle {
            font-family: 'VT323', monospace;
            font-size: 30px;
            letter-spacing: 2px;
            color: var(--text);
        }
        #livePrice {
            font-family: 'VT323', monospace;
            font-size: 26px;
            color: var(--green);
        }
        .top-right { display: flex; gap: 28px; }
        .top-stat { display: flex; flex-direction: column; align-items: flex-end; }
        .top-stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
        .top-stat-val { font-family: 'VT323', monospace; font-size: 22px; color: var(--green); }

        #chart-container { flex: 3; background: #000; min-height: 0; }

        /* ── POSITIONS ── */
        .positions-panel {
            flex: 1;
            min-height: 140px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .pos-header {
            padding: 7px 16px;
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .pos-count {
            font-family: 'VT323', monospace;
            font-size: 18px;
            color: var(--yellow);
        }
        .pos-scroll { overflow-y: auto; flex: 1; }
        .pos-scroll::-webkit-scrollbar { width: 3px; }
        .pos-scroll::-webkit-scrollbar-track { background: var(--bg); }
        .pos-scroll::-webkit-scrollbar-thumb { background: var(--border); }
        .pos-table { width: 100%; border-collapse: collapse; }
        .pos-table th {
            color: var(--muted);
            padding: 6px 16px;
            text-transform: uppercase;
            font-weight: 400;
            font-size: 9px;
            letter-spacing: 1px;
            text-align: left;
        }
        .pos-table td {
            padding: 7px 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
            font-size: 11px;
        }
        .pos-table tr:hover td { background: rgba(255,255,255,0.02); }
        .limit-tag {
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 2px;
            background: var(--border);
            color: #777;
            margin-right: 3px;
        }
        .close-btn { color: var(--muted); cursor: pointer; transition: color 0.15s; }
        .close-btn:hover { color: var(--red); }

        /* ── ORDER PANEL ── */
        .order-panel {
            width: 250px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 11px;
            flex-shrink: 0;
        }
        .order-title {
            font-family: 'VT323', monospace;
            font-size: 22px;
            color: var(--accent);
            letter-spacing: 2px;
            padding-bottom: 11px;
            border-bottom: 1px solid var(--border);
        }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label {
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        input, select {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px 10px;
            color: var(--text);
            border-radius: 2px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            outline: none;
            transition: border-color 0.15s;
            width: 100%;
        }
        input:focus, select:focus { border-color: var(--green); }
        select option { background: #111; }

        .tp-sl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .input-group.tp label { color: var(--green); }
        .input-group.sl label { color: var(--red); }

        .btn-trade {
            padding: 10px;
            border: none;
            border-radius: 2px;
            font-family: 'VT323', monospace;
            font-size: 22px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            width: 100%;
        }
        .btn-long { background: var(--green); color: #000; }
        .btn-long:hover { background: #00cc66; transform: translateY(-1px); }
        .btn-short { background: var(--red); color: #fff; }
        .btn-short:hover { background: #cc0000; transform: translateY(-1px); }
        .btn-trade:active { transform: translateY(0); }

        .order-footer {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            text-align: center;
        }
        .order-footer a {
            color: var(--muted);
            text-decoration: none;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.15s;
        }
        .order-footer a:hover { color: var(--yellow); }
    </style>
</head>
<body>

    <div class="market-sidebar">
        <div class="sidebar-logo">TR<span>ADING</span></div>
        <div class="sidebar-section">mercados</div>
        <div class="market-item active" onclick="changeSymbol('BTCUSDT', 'BINANCE:BTCUSDT', this)">
            BTC/USDT <span class="mprice" id="mp-BTC">—</span>
        </div>
        <div class="market-item" onclick="changeSymbol('ETHUSDT', 'BINANCE:ETHUSDT', this)">
            ETH/USDT <span class="mprice" id="mp-ETH">—</span>
        </div>
        <div class="market-item" onclick="changeSymbol('SOLUSDT', 'BINANCE:SOLUSDT', this)">
            SOL/USDT <span class="mprice" id="mp-SOL">—</span>
        </div>
        <div class="market-item" onclick="changeSymbol('BNBUSDT', 'BINANCE:BNBUSDT', this)">
            BNB/USDT <span class="mprice" id="mp-BNB">—</span>
        </div>
        <div class="market-item" onclick="changeSymbol('XRPUSDT', 'BINANCE:XRPUSDT', this)">
            XRP/USDT <span class="mprice" id="mp-XRP">—</span>
        </div>
    </div>

    <div class="trading-main">
        <div class="top-info">
            <div class="top-left">
                <span id="symbolTitle">BTCUSDT</span>
                <span id="livePrice">---</span>
            </div>
            <div class="top-right">
                <div class="top-stat">
                    <span class="top-stat-label">saldo</span>
                    <span class="top-stat-val" id="balanceText">$0.00</span>
                </div>
                <div class="top-stat">
                    <span class="top-stat-label">pnl total</span>
                    <span class="top-stat-val" id="totalPnLText">+$0.00</span>
                </div>
            </div>
        </div>

        <div id="chart-container"></div>

        <div class="positions-panel">
            <div class="pos-header">
                posiciones abiertas <span class="pos-count" id="pos-count">0</span>
            </div>
            <div class="pos-scroll">
                <table class="pos-table">
                    <thead>
                        <tr>
                            <th>Activo</th>
                            <th>Tipo</th>
                            <th>Entrada</th>
                            <th>TP / SL</th>
                            <th>PnL Live</th>
                            <th>Cerrar</th>
                        </tr>
                    </thead>
                    <tbody id="positionsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="order-panel">
        <div class="order-title">// EJECUTAR ORDEN</div>

        <div class="input-group">
            <label>Inversión ($)</label>
            <input type="number" id="tradeAmount" value="1000">
        </div>

        <div class="input-group">
            <label>Leverage</label>
            <select id="leverage">
                <option value="1">1x (Spot)</option>
                <option value="10">10x</option>
                <option value="50">50x</option>
                <option value="100">100x</option>
            </select>
        </div>

        <div class="tp-sl-row">
            <div class="input-group tp">
                <label>Take Profit</label>
                <input type="number" id="tpPrice" step="any" placeholder="Precio">
            </div>
            <div class="input-group sl">
                <label>Stop Loss</label>
                <input type="number" id="slPrice" step="any" placeholder="Precio">
            </div>
        </div>

        <button class="btn-trade btn-long" onclick="openPosition('LONG')">▲ LONG</button>
        <button class="btn-trade btn-short" onclick="openPosition('SHORT')">▼ SHORT</button>

        <div class="order-footer">
            <a href="categoria5-2.html">⚙ configuración</a>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let currentSymbol = 'BTCUSDT';
        let livePrices = {};
        let positions = JSON.parse(localStorage.getItem('trading_positions')) || [];
        let socket;

        const mpMap = { BTCUSDT:'BTC', ETHUSDT:'ETH', SOLUSDT:'SOL', BNBUSDT:'BNB', XRPUSDT:'XRP' };

        function initWebSocket() {
            if (socket) socket.close();
            socket = new WebSocket('wss://stream.binance.com:9443/ws/!miniTicker@arr');
            socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                data.forEach(t => { livePrices[t.s] = parseFloat(t.c); });

                if (livePrices[currentSymbol]) {
                    document.getElementById('livePrice').innerText = `$${livePrices[currentSymbol].toLocaleString()}`;
                }

                Object.entries(mpMap).forEach(([sym, key]) => {
                    const el = document.getElementById('mp-' + key);
                    if (el && livePrices[sym]) el.textContent = '$' + livePrices[sym].toLocaleString();
                });

                checkAutoClose();
                updateUI();
            };
        }

        function initChart(tvSymbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": tvSymbol,
                "interval": "5",
                "theme": "dark",
                "style": "1",
                "locale": "es",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "chart-container"
            });
        }

        function changeSymbol(s, tv, el) {
            currentSymbol = s;
            document.getElementById('symbolTitle').innerText = s;
            document.querySelectorAll('.market-item').forEach(m => m.classList.remove('active'));
            el.classList.add('active');
            initChart(tv);
        }

        function openPosition(type) {
            const price = livePrices[currentSymbol];
            if (!price) return alert("Cargando precios...");

            let balance = parseFloat(localStorage.getItem('trading_balance') || "10000");
            const amount = parseFloat(document.getElementById('tradeAmount').value);

            const tpVal = document.getElementById('tpPrice').value;
            const slVal = document.getElementById('slPrice').value;
            const tp = tpVal !== "" ? parseFloat(tpVal) : null;
            const sl = slVal !== "" ? parseFloat(slVal) : null;

            if (amount > balance) return alert("Saldo insuficiente");

            balance -= amount;
            localStorage.setItem('trading_balance', balance);

            positions.push({
                symbol: currentSymbol,
                type: type,
                amount: amount,
                entryPrice: price,
                leverage: parseInt(document.getElementById('leverage').value),
                tp: tp,
                sl: sl
            });

            save();
            document.getElementById('tpPrice').value = "";
            document.getElementById('slPrice').value = "";
        }

        function checkAutoClose() {
            positions.forEach((pos, i) => {
                const cur = livePrices[pos.symbol];
                if (!cur) return;

                let trigger = false;
                if (pos.type === 'LONG') {
                    if (pos.tp && cur >= pos.tp) trigger = true;
                    if (pos.sl && cur <= pos.sl) trigger = true;
                } else {
                    if (pos.tp && cur <= pos.tp) trigger = true;
                    if (pos.sl && cur >= pos.sl) trigger = true;
                }

                if (trigger) closePos(i, calculatePnL(pos, cur));
            });
        }

        function calculatePnL(pos, cur) {
            const diff = pos.type === 'LONG' ? (cur - pos.entryPrice) : (pos.entryPrice - cur);
            return (diff / pos.entryPrice) * pos.amount * pos.leverage;
        }

        function updateUI() {
            const balance = parseFloat(localStorage.getItem('trading_balance') || "10000");
            document.getElementById('balanceText').innerText = `$${balance.toLocaleString()}`;

            document.getElementById('pos-count').innerText = positions.length;

            const tbody = document.getElementById('positionsBody');
            let totalPnL = 0;
            tbody.innerHTML = '';

            positions.forEach((pos, i) => {
                const cur = livePrices[pos.symbol] || pos.entryPrice;
                const pnl = calculatePnL(pos, cur);
                totalPnL += pnl;

                tbody.innerHTML += `
                    <tr>
                        <td><b>${pos.symbol}</b></td>
                        <td style="color:${pos.type === 'LONG' ? 'var(--green)' : 'var(--red)'}">${pos.type} ${pos.leverage}x</td>
                        <td>$${pos.entryPrice.toFixed(2)}</td>
                        <td>
                            <span class="limit-tag">TP:${pos.tp || '-'}</span>
                            <span class="limit-tag">SL:${pos.sl || '-'}</span>
                        </td>
                        <td style="color:${pnl >= 0 ? 'var(--green)' : 'var(--red)'}">$${pnl.toFixed(2)}</td>
                        <td><i class="fas fa-times-circle close-btn" onclick="manualClose(${i})"></i></td>
                    </tr>`;
            });

            const pnlBox = document.getElementById('totalPnLText');
            pnlBox.innerText = (totalPnL >= 0 ? '+' : '') + `$${totalPnL.toFixed(2)}`;
            pnlBox.style.color = totalPnL >= 0 ? 'var(--green)' : 'var(--red)';
        }

        function manualClose(i) {
            const pos = positions[i];
            closePos(i, calculatePnL(pos, livePrices[pos.symbol] || pos.entryPrice));
        }

        function closePos(i, pnl) {
            let b = parseFloat(localStorage.getItem('trading_balance'));
            b += (positions[i].amount + pnl);
            localStorage.setItem('trading_balance', b);
            positions.splice(i, 1);
            save();
        }

        function save() {
            localStorage.setItem('trading_positions', JSON.stringify(positions));
            updateUI();
        }

        window.onload = () => {
            initChart('BINANCE:BTCUSDT');
            initWebSocket();
        };
    </script>
</body>
</html>
